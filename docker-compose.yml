version: '3.8'
services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: interviewiq
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
      - "5000:5000"
    environment:
      DATABASE_URL: postgresql://admin:password123@db:5432/interviewiq
      PORT: 5000
      JWT_SECRET: supersecretjwtkey
    depends_on:
      - db

volumes:
  db_data:
