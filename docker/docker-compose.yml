version: '3.8'

services:
  frontend:
    build:
      context: ../
      dockerfile: docker/frontend/Dockerfile
    container_name: careerpilot-frontend
    restart: always
    environment:
      - VITE_API_URL=https://api.careerpilot.ai
    depends_on:
      - backend

  backend:
    build:
      context: ../
      dockerfile: docker/backend/Dockerfile
    container_name: careerpilot-backend
    restart: always
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/careerpilot?schema=public
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=${JWT_SECRET:-production_secret_key}
      - REFRESH_SECRET=${REFRESH_SECRET:-production_refresh_key}
    depends_on:
      - postgres
      - redis

  crawler:
    build:
      context: ../
      dockerfile: docker/crawler/Dockerfile
    container_name: careerpilot-crawler
    restart: always
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/careerpilot?schema=public
    depends_on:
      - postgres

  postgres:
    image: postgres:15-alpine
    container_name: careerpilot-postgres
    restart: always
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=careerpilot
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: careerpilot-redis
    restart: always
    volumes:
      - redisdata:/data

  nginx:
    image: nginx:alpine
    container_name: careerpilot-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      # - /etc/letsencrypt:/etc/letsencrypt:ro # Uncomment for real SSL
    depends_on:
      - frontend
      - backend

volumes:
  pgdata:
  redisdata:
